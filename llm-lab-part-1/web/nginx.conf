server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React tek sayfalı uygulama: bilinmeyen yolları index.html'e düşür.
    location / {
        try_files $uri /index.html;
    }

    # Belge yükleme: nginx varsayılanı 1 MB; API 20 MB'a izin verdiği için burada biraz üstü.
    client_max_body_size 25m;

    # /api/... -> llmapi servisinin kökü. "llmapi" adı hem compose'da hem Kubernetes'te aynı servis adıdır.
    location /api/ {
        proxy_pass http://llmapi:8080/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # SSE akışı: tamponlama açık kalırsa token'lar birikip toplu gelir.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s; # model uzun düşünebilir
    }
}
